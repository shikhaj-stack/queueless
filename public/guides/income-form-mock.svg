<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow-inc" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect width="900" height="38" fill="#1e293b"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="540" height="22" rx="11" fill="#334155"/>
  <text x="450" y="23" font-size="11" fill="#cbd5e1" text-anchor="middle">https://mpedistrict.gov.in/Application/IncomeCertificate.aspx</text>

  <!-- Gov Header -->
  <rect y="38" width="900" height="52" fill="#047857"/>
  <text x="40" y="70" font-size="15" font-weight="700" fill="#ffffff">Revenue Dept • Application for Income Certificate (आय प्रमाण पत्र)</text>
  <rect x="740" y="48" width="120" height="30" rx="4" fill="#059669"/>
  <text x="800" y="68" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Form ID: MP-INC-02</text>

  <!-- Form Container -->
  <rect x="35" y="105" width="830" height="495" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow-inc)"/>

  <!-- Step Bar -->
  <rect x="35" y="105" width="830" height="36" fill="#f1f5f9" rx="8"/>
  <text x="150" y="127" font-size="11" font-weight="600" fill="#15803d">✓ 1. Citizen Profile</text>
  <text x="380" y="127" font-size="11" font-weight="700" fill="#047857">● 2. Family Income Assessment</text>
  <text x="650" y="127" font-size="11" font-weight="500" fill="#64748b">○ 3. Affidavit &amp; Proofs</text>

  <!-- Section 1: Income Details -->
  <text x="60" y="166" font-size="12" font-weight="700" fill="#0f172a">Annual Income Declaration (सकल पारिवारिक वार्षिक आय)</text>
  <line x1="60" y1="174" x2="840" y2="174" stroke="#e2e8f0"/>

  <!-- Field 1: Total Annual Family Income -->
  <text x="60" y="196" font-size="11" font-weight="600" fill="#334155">Total Annual Income of Entire Family (in ₹) <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="204" width="365" height="34" rx="5" fill="#f8fafc" stroke="#047857" stroke-width="2"/>
  <text x="74" y="226" font-size="12" font-weight="700" fill="#065f46">₹ 1,20,000 / Year</text>

  <!-- Field 2: Primary Source of Livelihood -->
  <text x="455" y="196" font-size="11" font-weight="600" fill="#334155">Source of Livelihood / Occupation <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="204" width="385" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="469" y="226" font-size="12" fill="#0f172a">Private Sector / Shop Employee (निजी रोज़गार)</text>

  <!-- Field 3: Agricultural Land Holding -->
  <text x="60" y="260" font-size="11" font-weight="600" fill="#334155">Agricultural Land Ownership in MP</text>
  <rect x="60" y="268" width="365" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="74" y="290" font-size="12" fill="#0f172a">Nil / None (कोई कृषि भूमि नहीं)</text>

  <!-- Field 4: Purpose of Certificate -->
  <text x="455" y="260" font-size="11" font-weight="600" fill="#334155">Purpose of Certificate <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="268" width="385" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="469" y="290" font-size="12" fill="#0f172a">College Scholarship &amp; Admission (छात्रवृत्ति)</text>

  <!-- Section 2: Family Members Breakdown -->
  <text x="60" y="330" font-size="12" font-weight="700" fill="#0f172a">Family Members Listed on Samagra / Ration Card</text>
  <line x1="60" y1="338" x2="840" y2="338" stroke="#e2e8f0"/>

  <rect x="60" y="350" width="780" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="75" y="372" font-size="11" font-weight="700" fill="#334155">Member Name</text>
  <text x="260" y="372" font-size="11" font-weight="700" fill="#334155">Relationship</text>
  <text x="440" y="372" font-size="11" font-weight="700" fill="#334155">Age</text>
  <text x="580" y="372" font-size="11" font-weight="700" fill="#334155">Individual Income</text>

  <text x="75" y="396" font-size="11" fill="#0f172a">1. Suresh Verma (Father)</text>
  <text x="260" y="396" font-size="11" fill="#0f172a">Head of Family</text>
  <text x="440" y="396" font-size="11" fill="#0f172a">54</text>
  <text x="580" y="396" font-size="11" font-weight="600" fill="#0f172a">₹ 1,20,000</text>

  <text x="75" y="414" font-size="11" fill="#0f172a">2. Rahul Verma (Applicant)</text>
  <text x="260" y="414" font-size="11" fill="#0f172a">Self / Student</text>
  <text x="440" y="414" font-size="11" fill="#0f172a">21</text>
  <text x="580" y="414" font-size="11" font-weight="600" fill="#0f172a">₹ 0 (Dependent)</text>

  <!-- Self Declaration -->
  <rect x="60" y="445" width="780" height="42" rx="4" fill="#fefce8" stroke="#fde047"/>
  <text x="76" y="464" font-size="11" font-weight="600" fill="#854d0e">Note: Income declared must match bank statements &amp; ITR if filed. Any discrepancy will lead to rejection.</text>
  <text x="76" y="478" font-size="10" fill="#a16207">नोट: घोषित आय बैंक विवरण और स्व-घोषणा से मेल खानी चाहिए।</text>

  <!-- Submit / Next -->
  <rect x="60" y="528" width="120" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="552" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">← Back</text>

  <rect x="195" y="528" width="190" height="38" rx="6" fill="#047857"/>
  <text x="290" y="552" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Save &amp; Upload Proofs →</text>
</svg>
