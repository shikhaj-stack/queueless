<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Chrome / Header -->
  <rect width="900" height="580" fill="#f8fafc"/>
  <rect width="900" height="38" fill="#1e293b"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="540" height="22" rx="11" fill="#334155"/>
  <text x="450" y="23" font-size="11" fill="#cbd5e1" text-anchor="middle">https://mpedistrict.gov.in/Citizen/Register.aspx</text>

  <!-- Gov Portal Banner -->
  <rect y="38" width="900" height="60" fill="#0f3d68"/>
  <circle cx="50" cy="68" r="18" fill="#fff" opacity="0.9"/>
  <text x="50" y="74" font-size="14" font-weight="900" fill="#0f3d68" text-anchor="middle">MP</text>
  <text x="82" y="62" font-size="15" font-weight="700" fill="#ffffff">MP e-District Portal (लोक सेवा केंद्र)</text>
  <text x="82" y="80" font-size="11" fill="#93c5fd">Government of Madhya Pradesh • Citizen Single Sign-On</text>
  <rect x="740" y="52" width="130" height="32" rx="4" fill="#0284c7"/>
  <text x="805" y="72" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Helpdesk: 181</text>

  <!-- Page Breadcrumb & Title -->
  <rect y="98" width="900" height="42" fill="#e2e8f0"/>
  <text x="40" y="124" font-size="13" font-weight="700" fill="#1e293b">Citizen Registration &amp; Mobile Linking (नागरिक पंजीयन)</text>
  <text x="860" y="124" font-size="11" fill="#64748b" text-anchor="end">Step 1: Identity Authentication</text>

  <!-- Registration Card Container -->
  <rect x="40" y="156" width="820" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  
  <!-- Step Indicator Tabs -->
  <rect x="40" y="156" width="273" height="38" fill="#e0f2fe" rx="8"/>
  <text x="176" y="180" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">1. Mobile &amp; Aadhaar OTP</text>
  <line x1="313" y1="156" x2="313" y2="194" stroke="#cbd5e1"/>
  <text x="450" y="180" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">2. Profile &amp; Samagra ID</text>
  <line x1="586" y1="156" x2="586" y2="194" stroke="#cbd5e1"/>
  <text x="723" y="180" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">3. Create Password</text>
  <line x1="40" y1="194" x2="860" y2="194" stroke="#cbd5e1"/>

  <!-- Form Fields -->
  <!-- Field 1: Full Name -->
  <text x="70" y="225" font-size="12" font-weight="600" fill="#1e293b">Full Name (As per Aadhaar Card) <tspan fill="#ef4444">*</tspan></text>
  <rect x="70" y="235" width="360" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="86" y="259" font-size="13" fill="#0f172a">RAHUL VERMA</text>

  <!-- Field 2: Mobile Number -->
  <text x="470" y="225" font-size="12" font-weight="600" fill="#1e293b">Aadhaar Linked Mobile Number <tspan fill="#ef4444">*</tspan></text>
  <rect x="470" y="235" width="360" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="486" y="259" font-size="13" fill="#0f172a">+91 98765 43210</text>
  <rect x="730" y="239" width="94" height="30" rx="4" fill="#0284c7"/>
  <text x="777" y="258" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Send OTP</text>

  <!-- Field 3: 12-digit Aadhaar Number -->
  <text x="70" y="305" font-size="12" font-weight="600" fill="#1e293b">Aadhaar Number (12 Digits) <tspan fill="#ef4444">*</tspan></text>
  <rect x="70" y="315" width="360" height="38" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="86" y="339" font-size="13" fill="#0f172a">XXXX-XXXX-8921</text>

  <!-- Field 4: Enter 6-digit OTP -->
  <text x="470" y="305" font-size="12" font-weight="600" fill="#1e293b">Enter 6-Digit Mobile OTP <tspan fill="#ef4444">*</tspan></text>
  <rect x="470" y="315" width="230" height="38" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="486" y="339" font-size="14" font-weight="700" letter-spacing="4" fill="#854d0e">482910</text>
  <rect x="710" y="315" width="120" height="38" rx="4" fill="#16a34a"/>
  <text x="770" y="338" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">✓ Verify OTP</text>

  <!-- Field 5: Email ID & District -->
  <text x="70" y="385" font-size="12" font-weight="600" fill="#1e293b">Email ID (Optional for Alerts)</text>
  <rect x="70" y="395" width="360" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="86" y="419" font-size="13" fill="#64748b">rahul.verma@example.com</text>

  <text x="470" y="385" font-size="12" font-weight="600" fill="#1e293b">District &amp; Tehsil <tspan fill="#ef4444">*</tspan></text>
  <rect x="470" y="395" width="360" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="486" y="419" font-size="13" fill="#0f172a">Bhopal • Huzur Tehsil</text>

  <!-- Consent Checkbox -->
  <rect x="70" y="456" width="16" height="16" rx="3" fill="#0284c7"/>
  <polyline points="73,464 77,468 83,460" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="96" y="469" font-size="11" fill="#475569">I hereby give consent to use my Aadhaar information for citizen e-services authentication.</text>

  <!-- Action Buttons -->
  <rect x="70" y="488" width="180" height="42" rx="6" fill="#0f172a"/>
  <text x="160" y="514" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Continue Registration →</text>
  
  <text x="830" y="514" font-size="12" fill="#0284c7" font-weight="600" text-anchor="end">Already have account? Citizen Login</text>
</svg>
