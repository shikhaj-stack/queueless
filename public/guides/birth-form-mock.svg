<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow-brt" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect width="900" height="38" fill="#1e293b"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="540" height="22" rx="11" fill="#334155"/>
  <text x="450" y="23" font-size="11" fill="#cbd5e1" text-anchor="middle">https://crsorgi.gov.in/web/index.php/auth/birthRegistration</text>

  <!-- Gov Header -->
  <rect y="38" width="900" height="52" fill="#4338ca"/>
  <text x="40" y="70" font-size="15" font-weight="700" fill="#ffffff">Civil Registration System (CRS) • Birth Reporting &amp; Certificate (जन्म पंजीयन)</text>
  <rect x="730" y="48" width="130" height="30" rx="4" fill="#4f46e5"/>
  <text x="795" y="68" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">BMC Zone 1 Bhopal</text>

  <!-- Form Container -->
  <rect x="35" y="105" width="830" height="495" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow-brt)"/>

  <!-- Step Bar -->
  <rect x="35" y="105" width="830" height="36" fill="#f1f5f9" rx="8"/>
  <text x="140" y="127" font-size="11" font-weight="600" fill="#4338ca">● 1. Child &amp; Birth Details</text>
  <text x="390" y="127" font-size="11" font-weight="500" fill="#64748b">○ 2. Parents' Identity &amp; Aadhaar</text>
  <text x="660" y="127" font-size="11" font-weight="500" fill="#64748b">○ 3. Hospital Discharge Upload</text>

  <!-- Section 1: Child Details -->
  <text x="60" y="166" font-size="12" font-weight="700" fill="#0f172a">Child Information (बच्चे का विवरण)</text>
  <line x1="60" y1="174" x2="840" y2="174" stroke="#e2e8f0"/>

  <!-- Field 1: Date of Birth -->
  <text x="60" y="196" font-size="11" font-weight="600" fill="#334155">Date of Birth (DD/MM/YYYY) <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="204" width="230" height="34" rx="5" fill="#f8fafc" stroke="#4338ca" stroke-width="2"/>
  <text x="74" y="226" font-size="12" font-weight="700" fill="#312e81">14/08/2026</text>

  <!-- Field 2: Gender -->
  <text x="310" y="196" font-size="11" font-weight="600" fill="#334155">Gender <tspan fill="#ef4444">*</tspan></text>
  <rect x="310" y="204" width="180" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="324" y="226" font-size="12" fill="#0f172a">Female (बालिका)</text>

  <!-- Field 3: Child Name (Optional if not yet named) -->
  <text x="510" y="196" font-size="11" font-weight="600" fill="#334155">Child Name (Leave blank if not decided)</text>
  <rect x="510" y="204" width="330" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="524" y="226" font-size="12" fill="#64748b">AARADHYA VERMA (Optional)</text>

  <!-- Section 2: Place of Birth & Hospital -->
  <text x="60" y="260" font-size="11" font-weight="600" fill="#334155">Place of Birth (Hospital / Home) <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="268" width="365" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="74" y="290" font-size="12" fill="#0f172a">Institutional - Sultania Zanana Hospital Bhopal</text>

  <!-- Field 5: Mother's Aadhaar & Name -->
  <text x="455" y="260" font-size="11" font-weight="600" fill="#334155">Mother's Full Name (as per Aadhaar) <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="268" width="385" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="469" y="290" font-size="12" fill="#0f172a">PRIYA VERMA</text>

  <!-- Section 3: Father's Name & Permanent Address -->
  <text x="60" y="330" font-size="12" font-weight="700" fill="#0f172a">Father's Details &amp; Address at Time of Birth</text>
  <line x1="60" y1="338" x2="840" y2="338" stroke="#e2e8f0"/>

  <text x="60" y="358" font-size="11" font-weight="600" fill="#334155">Father's Full Name <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="366" width="365" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="74" y="388" font-size="12" fill="#0f172a">RAHUL VERMA</text>

  <text x="455" y="358" font-size="11" font-weight="600" fill="#334155">Parents' Address during Birth <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="366" width="385" height="52" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="469" y="386" font-size="12" fill="#0f172a">45 Shivaji Nagar, Ward 32, BMC Bhopal 462016</text>

  <!-- 21-day timeline tip -->
  <rect x="60" y="445" width="780" height="42" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="76" y="464" font-size="11" font-weight="700" fill="#065f46">⏱️ Free 21-Day Registration Window Active</text>
  <text x="76" y="478" font-size="10" fill="#047857">Registering within 21 days is 100% free with zero late fees or notary affidavit required.</text>

  <!-- Submit Buttons -->
  <rect x="60" y="528" width="120" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="552" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">← Back</text>

  <rect x="195" y="528" width="210" height="38" rx="6" fill="#4338ca"/>
  <text x="300" y="552" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Proceed to Discharge Slip Upload →</text>
</svg>
