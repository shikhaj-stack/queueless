    <text x="76" y="394" font-size="13" fill="#0f172a">Bhopal, MP 462016</text>
  </g>
  <rect x="60" y="436" width="130" height="40" rx="6" fill="#1d4ed8"/>
  <text x="125" y="461" font-size="13" fill="#fff" text-anchor="middle">Save &amp; Next</text>
  <rect x="520" y="90" width="220" height="140" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="540" y="118" font-size="12" font-weight="600" fill="#0f172a">Simulated illustration</text>
  <text x="540" y="140" font-size="11" fill="#64748b">Field names match the live</text>
