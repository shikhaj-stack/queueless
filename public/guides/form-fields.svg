<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui,sans-serif">
  <rect width="800" height="500" fill="#fff"/>
  <rect y="0" width="800" height="56" fill="#334155"/>
  <text x="30" y="34" font-size="15" font-weight="700" fill="#fff">Application Form</text>
  <text x="770" y="34" font-size="12" fill="#cbd5e1" text-anchor="end">Step 2 of 4</text>
  <g font-size="12" fill="#475569">
    <text x="60" y="100">Applicant name (as on Aadhaar)</text>
    <rect x="60" y="110" width="400" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="76" y="135" font-size="13" fill="#0f172a">RAHUL VERMA</text>

    <text x="60" y="180">Date of birth</text>
    <rect x="60" y="190" width="400" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="76" y="215" font-size="13" fill="#0f172a">12/04/1998</text>

    <text x="60" y="260">Samagra ID</text>
    <rect x="60" y="270" width="400" height="38" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="76" y="295" font-size="13" fill="#0f172a">1234 5678 90</text>

