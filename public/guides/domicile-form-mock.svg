<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="shadow-dom" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Chrome / Header -->
  <rect width="900" height="620" fill="#f8fafc"/>
  <rect width="900" height="38" fill="#1e293b"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <rect x="180" y="8" width="540" height="22" rx="11" fill="#334155"/>
  <text x="450" y="23" font-size="11" fill="#cbd5e1" text-anchor="middle">https://mpedistrict.gov.in/Application/DomicileCertificate.aspx</text>

  <!-- Gov Header -->
  <rect y="38" width="900" height="52" fill="#1e3a8a"/>
  <text x="40" y="70" font-size="15" font-weight="700" fill="#ffffff">Revenue Dept • Application for Local Resident (मूल निवासी) Certificate</text>
  <rect x="740" y="48" width="120" height="30" rx="4" fill="#1d4ed8"/>
  <text x="800" y="68" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Form ID: MP-DOM-01</text>

  <!-- Form Container -->
  <rect x="35" y="105" width="830" height="495" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow-dom)"/>

  <!-- Step Bar -->
  <rect x="35" y="105" width="830" height="36" fill="#f1f5f9" rx="8"/>
  <circle cx="65" cy="123" r="10" fill="#16a34a"/>
  <text x="65" y="127" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">✓</text>
  <text x="85" y="127" font-size="11" font-weight="600" fill="#15803d">1. Registration</text>

  <line x1="165" y1="123" x2="200" y2="123" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="215" cy="123" r="10" fill="#1d4ed8"/>
  <text x="215" y="127" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="235" y="127" font-size="11" font-weight="700" fill="#1d4ed8">2. Applicant Details</text>

  <line x1="345" y1="123" x2="380" y2="123" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="395" cy="123" r="10" fill="#e2e8f0"/>
  <text x="395" y="127" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">3</text>
  <text x="415" y="127" font-size="11" font-weight="500" fill="#64748b">3. Document Upload</text>

  <line x1="535" y1="123" x2="570" y2="123" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="585" cy="123" r="10" fill="#e2e8f0"/>
  <text x="585" y="127" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">4</text>
  <text x="605" y="127" font-size="11" font-weight="500" fill="#64748b">4. Fee &amp; Submit</text>

  <!-- Section 1: Basic Information -->
  <text x="60" y="166" font-size="12" font-weight="700" fill="#0f172a">Section A: Applicant Identity &amp; Samagra Record</text>
  <line x1="60" y1="174" x2="840" y2="174" stroke="#e2e8f0"/>

  <!-- Field 1: Applicant Name -->
  <text x="60" y="196" font-size="11" font-weight="600" fill="#334155">Full Applicant Name (English) <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="204" width="365" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="74" y="226" font-size="12" fill="#0f172a">RAHUL VERMA</text>

  <!-- Field 2: Father / Husband Name -->
  <text x="455" y="196" font-size="11" font-weight="600" fill="#334155">Father / Husband Name <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="204" width="385" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="469" y="226" font-size="12" fill="#0f172a">SURESH VERMA</text>

  <!-- Field 3: Samagra Member ID -->
  <text x="60" y="260" font-size="11" font-weight="600" fill="#334155">9-Digit Samagra Member ID <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="268" width="240" height="34" rx="5" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="74" y="290" font-size="12" font-weight="600" fill="#92400e">194829104</text>
  <rect x="308" y="268" width="117" height="34" rx="4" fill="#0284c7"/>
  <text x="366" y="289" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Fetch Samagra</text>

  <!-- Field 4: Gender & Category -->
  <text x="455" y="260" font-size="11" font-weight="600" fill="#334155">Gender &amp; Category <tspan fill="#ef4444">*</tspan></text>
  <rect x="455" y="268" width="185" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="469" y="290" font-size="12" fill="#0f172a">Male (पुरुष)</text>
  <rect x="655" y="268" width="185" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="669" y="290" font-size="12" fill="#0f172a">OBC (अन्य पिछड़ा वर्ग)</text>

  <!-- Section 2: Residence & Eligibility -->
  <text x="60" y="330" font-size="12" font-weight="700" fill="#0f172a">Section B: Residential Address &amp; Years of Stay</text>
  <line x1="60" y1="338" x2="840" y2="338" stroke="#e2e8f0"/>

  <!-- Field 5: Permanent Address -->
  <text x="60" y="358" font-size="11" font-weight="600" fill="#334155">Permanent Address (as per Electricity/Water bill) <tspan fill="#ef4444">*</tspan></text>
  <rect x="60" y="366" width="480" height="54" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="74" y="388" font-size="12" fill="#0f172a">H.No 45, Near Hanuman Temple, Shivaji Nagar</text>
  <text x="74" y="406" font-size="12" fill="#0f172a">Bhopal, Madhya Pradesh - 462016</text>

  <!-- Field 6: Years of Residence -->
  <text x="560" y="358" font-size="11" font-weight="600" fill="#334155">Continuous Years in MP <tspan fill="#ef4444">*</tspan></text>
  <rect x="560" y="366" width="280" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="574" y="388" font-size="12" fill="#0f172a">15 Years (Since 2011)</text>

  <!-- Field 7: Eligibility Criteria Radio -->
  <text x="60" y="442" font-size="11" font-weight="600" fill="#334155">Eligibility Clause <tspan fill="#ef4444">*</tspan></text>
  <circle cx="70" cy="458" r="6" fill="#1d4ed8"/>
  <circle cx="70" cy="458" r="2" fill="#fff"/>
  <text x="84" y="462" font-size="11" fill="#1e293b">Born in MP and continuous residence for 10+ years (Clause 1.1)</text>

  <circle cx="560" cy="458" r="6" fill="#fff" stroke="#94a3b8"/>
  <text x="574" y="462" font-size="11" fill="#64748b">Govt Employee / 15 years state residency</text>

  <!-- Field 8: Self Declaration checkbox -->
  <rect x="60" y="488" width="16" height="16" rx="3" fill="#1d4ed8"/>
  <polyline points="63,496 67,500 73,492" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="86" y="500" font-size="11" font-weight="600" fill="#0f172a">I certify that all statements made above are true to my knowledge. Submitting false data leads to penalty under Section 193 IPC.</text>

  <!-- Bottom Navigation Buttons -->
  <rect x="60" y="534" width="120" height="38" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="120" y="558" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">← Back to Draft</text>

  <rect x="195" y="534" width="190" height="38" rx="6" fill="#16a34a"/>
  <text x="290" y="558" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Save &amp; Proceed to Upload →</text>

  <text x="840" y="558" font-size="11" fill="#64748b" text-anchor="end">Auto-saved 1 minute ago</text>
</svg>
